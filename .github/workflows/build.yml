# Reusable: runs every test that needs no device, builds trustctl for all platforms and
# packs the release archives (artifact "archives"). Called by ci.yml and release.yml.
name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: trustctl/go.mod
          cache-dependency-path: trustctl/go.sum
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - name: Install the AVR toolchain and U8g2 (the versions the committed firmware was built with)
        run: |
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install U8g2@2.36.19
      - name: Install Mono (for the tray tool's tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-mcs mono-runtime mono-devel
      - name: gofmt and go vet
        working-directory: trustctl
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: trustctl unit tests
        working-directory: trustctl
        run: go test ./...
      - name: Firmware host tests
        run: firmware/test/run.sh
      - name: shellcheck
        run: shellcheck -S warning tools/user/trustctl-menu tools/user/*.sh tools/build/*.sh firmware/*/build.sh
      - name: trustctl-menu tests
        run: tools/build/test_trustctl_menu.sh
      - name: onboard_usbtiny.sh tests (fake avrdude)
        run: tools/build/test_onboard_usbtiny.sh
      - name: Rig CI tests (the rig power is switched off in every case)
        run: tools/build/test_rig_ci.py
      - name: Tray tool tests (Mono)
        run: tools/user/trustctl-tray/test.sh
      - name: Build the firmware and the bootloader
        run: |
          tools/build/embed_firmware.sh
          make -C firmware/bootloader
      - name: The committed firmware must be what the sources build
        run: |
          git diff --exit-code -- trustctl/internal/firmware || {
            echo "::error::trustctl/internal/firmware differs from a fresh build: run tools/build/embed_firmware.sh and commit"
            exit 1
          }
      - name: Build trustctl and run the simulated-device smoke test
        run: |
          cd trustctl && go build -o bin/trustctl ./cmd/trustctl
          cd .. && tools/build/smoke_dummy.py trustctl/bin/trustctl
      - name: Documentation (display pictures are current, Sphinx builds without warnings)
        run: |
          pip install pillow -r docs/requirements.txt
          tools/docs/gen_display_images.py --check
          sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootloader
          path: firmware/bootloader/boot.hex

  tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build trustctl-tray.exe with the compiler that ships with Windows
        shell: cmd
        run: tools\user\trustctl-tray\build.cmd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tray
          path: tools/user/trustctl-tray/trustctl-tray.exe

  package:
    needs: [test, tray]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: trustctl/go.mod
          cache-dependency-path: trustctl/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
      - name: Cross-compile and pack
        run: |
          tools/build/release.sh --quick
          version=$(cat trustctl/internal/firmware/VERSION)
          case "$GITHUB_REF" in
            refs/tags/v*) name="v$version" ;;
            *) name="nightly-fw$version-$(git rev-parse --short HEAD)" ;;
          esac
          tools/build/package.py "$name" --tray parts/tray/trustctl-tray.exe --bootloader parts/bootloader/boot.hex
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: dist/archives/*
          if-no-files-found: error
