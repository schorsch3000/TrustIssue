# A tag vMAJOR.MINOR.PATCH makes a full release. The tag comes from tools/build/make_release.py,
# which ran all tests (rig included) and committed the test report first.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag must be a signed tag of a master commit that matches the firmware version and has a test report
        run: |
          tag=${GITHUB_REF_NAME}
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad tag $tag"; exit 1; }
          git fetch --force --tags origin
          git fetch origin master
          git merge-base --is-ancestor "$tag^{commit}" origin/master || { echo "::error::$tag is not on master"; exit 1; }
          [ "$tag" = "v$(cat trustctl/internal/firmware/VERSION)" ] || { echo "::error::$tag does not match the firmware version $(cat trustctl/internal/firmware/VERSION)"; exit 1; }
          [ -f "docs/test-reports/$tag.md" ] || { echo "::error::docs/test-reports/$tag.md is missing: run tools/build/make_release.py"; exit 1; }
          git -c gpg.ssh.allowedSignersFile=.github/allowed_signers tag -v "$tag"

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: archives
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: archives/*
      - name: Create the release
        run: |
          tag=${GITHUB_REF_NAME}
          cp "docs/test-reports/$tag.md" "archives/test-report-$tag.md"
          {
            echo "Release $tag (firmware $(cat trustctl/internal/firmware/VERSION))."
            echo
            echo "The test report of this release, with the results of the tests that need the real device, is attached (\`test-report-$tag.md\`)."
            echo "trustctl for macOS and the BSDs is cross-compiled but has not been run by the author."
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS\` or \`gh attestation verify FILE --repo $GITHUB_REPOSITORY\`."
            echo
            tools/build/release_notes.sh "$tag"
          } > notes.md
          gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md archives/*
